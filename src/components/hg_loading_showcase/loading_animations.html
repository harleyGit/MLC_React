<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 加载动画合集 · 8 种纯 CSS Loading</title>
<style>
  /* ========== 页面基础样式（深色主题） ========== */
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --card-border: #21262d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --accent-2: #bc8cff;
    --copy-hover: #1f6feb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 48px 24px;
  }
  .page-header { text-align: center; margin-bottom: 48px; }
  .page-header h1 {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .page-header p { color: var(--text-secondary); font-size: 15px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: #30363d; }
  .preview {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
    margin-bottom: 18px;
  }
  .card h3 { font-size: 17px; margin-bottom: 6px; }
  .card .desc { color: var(--text-secondary); font-size: 13px; line-height: 1.6; margin-bottom: 16px; flex: 1; }
  .copy-btn {
    align-self: flex-start;
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(88, 166, 255, 0.4);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
  }
  .copy-btn:hover { background: var(--copy-hover); color: #fff; }
  .copy-btn.copied { color: #3fb950; border-color: rgba(63, 185, 80, 0.5); }

  /* ==================================================
     动画 1：旋转圆环（渐变边框旋转）
     ================================================== */
  .ring-spinner {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 4px solid rgba(88, 166, 255, 0.15);
    border-top-color: var(--accent);
    animation: ring-rotate 1s linear infinite;
  }
  @keyframes ring-rotate { to { transform: rotate(360deg); } }

  /* ==================================================
     动画 2：脉冲圆点（三点缩放）
     ================================================== */
  .pulse-dots { display: flex; gap: 10px; }
  .pulse-dots span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-2);
    animation: pulse-scale 1.2s ease-in-out infinite;
  }
  .pulse-dots span:nth-child(2) { animation-delay: 0.2s; }
  .pulse-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse-scale {
    0%, 100% { transform: scale(0.6); opacity: 0.4; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  /* ==================================================
     动画 3：弹跳柱条（五柱交错弹跳）
     ================================================== */
  .bounce-bars { display: flex; align-items: center; gap: 6px; height: 56px; }
  .bounce-bars span {
    width: 8px;
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    animation: bounce-bar 1.1s ease-in-out infinite;
    transform-origin: center;
  }
  .bounce-bars span:nth-child(2) { animation-delay: 0.12s; }
  .bounce-bars span:nth-child(3) { animation-delay: 0.24s; }
  .bounce-bars span:nth-child(4) { animation-delay: 0.36s; }
  .bounce-bars span:nth-child(5) { animation-delay: 0.48s; }
  @keyframes bounce-bar {
    0%, 100% { transform: scaleY(0.35); }
    50% { transform: scaleY(1); }
  }

  /* ==================================================
     动画 4：波纹圆圈（涟漪扩散）
     ================================================== */
  .ripple { position: relative; width: 72px; height: 72px; }
  .ripple span {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid var(--accent);
    opacity: 1;
    animation: ripple-expand 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
  }
  .ripple span:nth-child(2) { animation-delay: -0.9s; }
  @keyframes ripple-expand {
    0% { transform: scale(0.15); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  /* ==================================================
     动画 5：渐变锥形旋转器（conic-gradient）
     ================================================== */
  .conic-spinner {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 10%, var(--accent-2));
    mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    animation: ring-rotate 0.9s linear infinite;
  }

  /* ==================================================
     动画 6：打字指示器（聊天气泡三点）
     ================================================== */
  .typing-bubble {
    background: #21262d;
    border-radius: 20px;
    padding: 14px 20px;
    display: flex;
    gap: 7px;
    align-items: center;
  }
  .typing-bubble span {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--text-secondary);
    animation: typing-bounce 1.3s ease-in-out infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
    30% { transform: translateY(-7px); opacity: 1; }
  }

  /* ==================================================
     动画 7：骨架屏微光（扫光扫过占位块）
     ================================================== */
  .skeleton { width: 180px; display: flex; flex-direction: column; gap: 12px; }
  .skeleton .row { display: flex; gap: 12px; align-items: center; }
  .skeleton .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .skeleton .lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skeleton .line { height: 12px; border-radius: 6px; }
  .skeleton .line.short { width: 60%; }
  .skeleton .block { height: 72px; border-radius: 8px; }
  .skeleton .avatar, .skeleton .line, .skeleton .block {
    background: linear-gradient(90deg, #21262d 25%, #30363d 50%, #21262d 75%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.5s linear infinite;
  }
  @keyframes skeleton-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ==================================================
     动画 8：DNA 双螺旋（双链旋转）
     ================================================== */
  .dna { position: relative; width: 64px; height: 96px; }
  .dna i {
    position: absolute;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: dna-spin 2.2s linear infinite;
  }
  .dna i.a { background: var(--accent); }
  .dna i.b { background: var(--accent-2); }
  /* 8 层节点，每层垂直错开；A 链与 B 链相位相差 180deg 形成双螺旋 */
  .dna i:nth-child(1) { top: 0;   animation-delay: 0s; }
  .dna i:nth-child(2) { top: 12px; animation-delay: -2.2s; }
  .dna i:nth-child(3) { top: 24px; animation-delay: -0.275s; }
  .dna i:nth-child(4) { top: 36px; animation-delay: -2.2s; }
  .dna i:nth-child(5) { top: 48px; animation-delay: -0.55s; }
  .dna i:nth-child(6) { top: 60px; animation-delay: -2.2s; }
  .dna i:nth-child(7) { top: 72px; animation-delay: -0.825s; }
  .dna i:nth-child(8) { top: 84px; animation-delay: -2.2s; }
  @keyframes dna-spin {
    0%   { transform: translateX(calc(-50% - 22px)) scale(0.7); }
    50%  { transform: translateX(calc(-50% + 22px)) scale(1); }
    100% { transform: translateX(calc(-50% - 22px)) scale(0.7); }
  }

  /* ========== 无障碍：用户偏好减少动画时降级为静态 ========== */
  @media (prefers-reduced-motion: reduce) {
    .ring-spinner, .pulse-dots span, .bounce-bars span, .ripple span,
    .conic-spinner, .typing-bubble span, .skeleton .avatar,
    .skeleton .line, .skeleton .block, .dna i {
      animation: none !important;
    }
    .card { transition: none; }
  }
</style>
</head>
<body>

<header class="page-header">
  <h1>CSS 加载动画合集</h1>
  <p>8 种纯 CSS Loading 动画 · 仅使用 keyframes + transform · 复制即可使用</p>
</header>

<main class="grid" id="grid"></main>

<script>
  // 每种动画的卡片数据：名称、描述、预览 HTML、可复制的 CSS 源码
  var ANIMATIONS = [
    {
      name: "旋转圆环",
      desc: "渐变边框旋转，经典加载指示器",
      preview: '<div class="ring-spinner"></div>',
      css: '.ring-spinner {\n  width: 48px;\n  height: 48px;\n  border-radius: 50%;\n  border: 4px solid rgba(88, 166, 255, 0.15);\n  border-top-color: #58a6ff;\n  animation: ring-rotate 1s linear infinite;\n}\n@keyframes ring-rotate {\n  to { transform: rotate(360deg); }\n}'
    },
    {
      name: "脉冲圆点",
      desc: "三点缩放，简约节奏感",
      preview: '<div class="pulse-dots"><span></span><span></span><span></span></div>',
      css: '.pulse-dots {\n  display: flex;\n  gap: 10px;\n}\n.pulse-dots span {\n  width: 14px;\n  height: 14px;\n  border-radius: 50%;\n  background: #bc8cff;\n  animation: pulse-scale 1.2s ease-in-out infinite;\n}\n.pulse-dots span:nth-child(2) { animation-delay: 0.2s; }\n.pulse-dots span:nth-child(3) { animation-delay: 0.4s; }\n@keyframes pulse-scale {\n  0%, 100% { transform: scale(0.6); opacity: 0.4; }\n  50% { transform: scale(1.15); opacity: 1; }\n}'
    },
    {
      name: "弹跳柱条",
      desc: "五柱交错弹跳，音频可视化风格",
      preview: '<div class="bounce-bars"><span></span><span></span><span></span><span></span><span></span></div>',
      css: '.bounce-bars {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  height: 56px;\n}\n.bounce-bars span {\n  width: 8px;\n  height: 100%;\n  border-radius: 4px;\n  background: linear-gradient(180deg, #58a6ff, #bc8cff);\n  animation: bounce-bar 1.1s ease-in-out infinite;\n  transform-origin: center;\n}\n.bounce-bars span:nth-child(2) { animation-delay: 0.12s; }\n.bounce-bars span:nth-child(3) { animation-delay: 0.24s; }\n.bounce-bars span:nth-child(4) { animation-delay: 0.36s; }\n.bounce-bars span:nth-child(5) { animation-delay: 0.48s; }\n@keyframes bounce-bar {\n  0%, 100% { transform: scaleY(0.35); }\n  50% { transform: scaleY(1); }\n}'
    },
    {
      name: "波纹圆圈",
      desc: "涟漪扩散效果，雷达探测感",
      preview: '<div class="ripple"><span></span><span></span></div>',
      css: '.ripple {\n  position: relative;\n  width: 72px;\n  height: 72px;\n}\n.ripple span {\n  position: absolute;\n  inset: 0;\n  border-radius: 50%;\n  border: 3px solid #58a6ff;\n  animation: ripple-expand 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;\n}\n.ripple span:nth-child(2) { animation-delay: -0.9s; }\n@keyframes ripple-expand {\n  0% { transform: scale(0.15); opacity: 1; }\n  100% { transform: scale(1); opacity: 0; }\n}'
    },
    {
      name: "渐变旋转器",
      desc: "锥形渐变旋转，现代质感",
      preview: '<div class="conic-spinner"></div>',
      css: '.conic-spinner {\n  width: 52px;\n  height: 52px;\n  border-radius: 50%;\n  background: conic-gradient(from 0deg, transparent 10%, #bc8cff);\n  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));\n  mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));\n  animation: conic-rotate 0.9s linear infinite;\n}\n@keyframes conic-rotate {\n  to { transform: rotate(360deg); }\n}'
    },
    {
      name: "打字指示器",
      desc: "聊天输入指示器，对话 UI 必备",
      preview: '<div class="typing-bubble"><span></span><span></span><span></span></div>',
      css: '.typing-bubble {\n  background: #21262d;\n  border-radius: 20px;\n  padding: 14px 20px;\n  display: flex;\n  gap: 7px;\n  align-items: center;\n}\n.typing-bubble span {\n  width: 9px;\n  height: 9px;\n  border-radius: 50%;\n  background: #8b949e;\n  animation: typing-bounce 1.3s ease-in-out infinite;\n}\n.typing-bubble span:nth-child(2) { animation-delay: 0.18s; }\n.typing-bubble span:nth-child(3) { animation-delay: 0.36s; }\n@keyframes typing-bounce {\n  0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }\n  30% { transform: translateY(-7px); opacity: 1; }\n}'
    },
    {
      name: "骨架屏微光",
      desc: "占位内容扫光效果，加载过渡自然",
      preview: '<div class="skeleton"><div class="row"><div class="avatar"></div><div class="lines"><div class="line"></div><div class="line short"></div></div></div><div class="block"></div></div>',
      css: '.skeleton .avatar,\n.skeleton .line,\n.skeleton .block {\n  background: linear-gradient(90deg, #21262d 25%, #30363d 50%, #21262d 75%);\n  background-size: 200% 100%;\n  animation: skeleton-shimmer 1.5s linear infinite;\n}\n.skeleton .avatar { width: 42px; height: 42px; border-radius: 50%; }\n.skeleton .line { height: 12px; border-radius: 6px; }\n.skeleton .block { height: 72px; border-radius: 8px; }\n@keyframes skeleton-shimmer {\n  0% { background-position: 200% 0; }\n  100% { background-position: -200% 0; }\n}'
    },
    {
      name: "DNA 双螺旋",
      desc: "双链旋转动画，科技生物感",
      preview: '<div class="dna"><i class="a"></i><i class="b"></i><i class="a"></i><i class="b"></i><i class="a"></i><i class="b"></i><i class="a"></i><i class="b"></i></div>',
      css: '.dna {\n  position: relative;\n  width: 64px;\n  height: 96px;\n}\n.dna i {\n  position: absolute;\n  left: 50%;\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n  animation: dna-spin 2.2s linear infinite;\n}\n.dna i.a { background: #58a6ff; }\n.dna i.b { background: #bc8cff; }\n/* 偶数节点反向相位，形成双链交错 */\n.dna i:nth-child(2n) { animation-delay: -2.2s; }\n.dna i:nth-child(1) { top: 0; }\n.dna i:nth-child(2) { top: 12px; }\n.dna i:nth-child(3) { top: 24px; animation-delay: -0.275s; }\n.dna i:nth-child(4) { top: 36px; }\n.dna i:nth-child(5) { top: 48px; animation-delay: -0.55s; }\n.dna i:nth-child(6) { top: 60px; }\n.dna i:nth-child(7) { top: 72px; animation-delay: -0.825s; }\n.dna i:nth-child(8) { top: 84px; }\n@keyframes dna-spin {\n  0%   { transform: translateX(calc(-50% - 22px)) scale(0.7); }\n  50%  { transform: translateX(calc(-50% + 22px)) scale(1); }\n  100% { transform: translateX(calc(-50% - 22px)) scale(0.7); }\n}'
    }
  ];

  // 渲染卡片网格：每个卡片包含预览区、名称、描述和复制按钮
  function renderGrid() {
    var grid = document.getElementById("grid");
    grid.innerHTML = ANIMATIONS.map(function (item, index) {
      return (
        '<div class="card">' +
          '<div class="preview">' + item.preview + '</div>' +
          '<h3>' + item.name + '</h3>' +
          '<p class="desc">' + item.desc + '</p>' +
          '<button class="copy-btn" data-index="' + index + '">复制 CSS</button>' +
        '</div>'
      );
    }).join("");
  }

  // 复制指定动画的 CSS 到剪贴板，成功后按钮短暂显示「已复制」
  function copyCSS(index, btn) {
    var text = ANIMATIONS[index].css;
    function onSuccess() {
      btn.textContent = "已复制 ✓";
      btn.classList.add("copied");
      setTimeout(function () {
        btn.textContent = "复制 CSS";
        btn.classList.remove("copied");
      }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onSuccess);
    } else {
      // 降级方案：旧浏览器使用临时 textarea + execCommand
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      onSuccess();
    }
  }

  renderGrid();
  document.getElementById("grid").addEventListener("click", function (e) {
    var btn = e.target.closest(".copy-btn");
    if (btn) copyCSS(Number(btn.dataset.index), btn);
  });
</script>
</body>
</html>
